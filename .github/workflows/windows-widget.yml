name: Build Windows 11 widget

on:
  push:
    paths:
      - 'WindowsWidgets/**'
      - 'test/board/**'
      - 'test/fixtures/**'
      - '.github/workflows/windows-widget.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@v2
      - name: Test quota response parsing
        run: dotnet run --project test/board/BoardParserTests.csproj --configuration Release
      - name: Build unsigned MSIX
        shell: pwsh
        run: |
          msbuild WindowsWidgets/CodexQuotaBoard.csproj /restore /m `
            /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 `
            /p:GenerateAppxPackageOnBuild=true /p:AppxPackageSigningEnabled=false `
            /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideLoadOnly
      - uses: actions/upload-artifact@v4
        with:
          name: codex-quota-board-unsigned
          path: |
            WindowsWidgets/**/CodexQuotaBoard_*.msix
          if-no-files-found: error
